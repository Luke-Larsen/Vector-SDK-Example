[package]
name = "scheduled-messages"
version = "0.1.0"
edition = "2021"

[dependencies]
vector-sdk = { git = "https://github.com/VectorPrivacy/Vector-SDK.git", branch = "main" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
log = "0.4"
env_logger = "0.10"
uuid = { version = "1.0", features = ["v4"] }
